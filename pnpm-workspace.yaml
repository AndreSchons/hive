packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# pnpm bloqueia scripts de postinstall por padrao. Estes dois precisam rodar:
# electron baixa o binario, esbuild compila nativo. better-sqlite3 fica de fora:
# ele ja traz o binario pronto (N-API) de cada plataforma e o carrega antes de
# qualquer build; o node-gyp so serviria para exigir Python e compilador C++,
# que o Windows nao tem por padrao.
allowBuilds:
  better-sqlite3: false
  electron: true
  esbuild: true
  # dependencia do electron-builder para Squirrel; o instalador aqui e NSIS.
  electron-winstaller: false
